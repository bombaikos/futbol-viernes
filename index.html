<style>
  :root{
    --navy: #243B69; //#0B1220
    --navy-light: #EDF1FA;
    --navy-mid: #C9D3E8;
    --white: #FFFFFF;
    --muted: #6B7383;
    --danger: #C0392B;
    --danger-soft: #FBEAEA;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{ margin:0; background:var(--white); color:var(--navy); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'DM Sans',sans-serif; font-weight:800; letter-spacing:0.01em; }
  #app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--white);}

  .topbar{ padding:20px 20px 4px; position:relative; }
  .topbar h1{ font-size:30px; line-height:1; margin:0; color:var(--navy); }
  .auth-corner{ position:absolute; top:20px; right:18px; }
  .auth-pill{
    background:var(--white); color:var(--navy); border:1.5px solid var(--navy-mid);
    padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .auth-pill.on{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .tabs{ display:flex; gap:6px; margin:16px 16px 0; }

  .tab.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .content{ padding:22px 16px 90px; }
  .section-title{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); margin:0 0 12px; }

  .card{ background:var(--white); border:1.5px solid var(--navy-mid); border-radius:10px; padding:16px; margin-bottom:12px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }

  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password]{
    font-family:'DM Sans',sans-serif; border:1.5px solid var(--navy-mid); border-radius:8px; padding:10px 12px; font-size:16px; color:var(--navy); background:#fff; width:100%;

  input[type=date]{ min-width:0; -webkit-min-logical-width:0; -webkit-appearance:none; appearance:none; box-sizing:border-box; }
  input:focus{ outline:none; border-color:var(--navy); background:var(--navy-light); }
  select{
    font-family:'DM Sans',sans-serif; border:1.5px solid var(--navy-mid); border-radius:8px; padding:10px 12px; font-size:16px; color:var(--navy); background:#fff; width:100%;
  }
  select:focus{ outline:none; border-color:var(--navy); }

  button{ font-family:'DM Sans',sans-serif; font-weight:700; font-size:14px; border:none; border-radius:8px; padding:12px 16px; cursor:pointer; transition:transform .08s ease, opacity .15s ease; touch-action:manipulation; }
  button:active{ transform:scale(0.97); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:disabled{ background:var(--navy-mid); }
  .btn-ghost{ background:var(--navy-light); color:var(--navy); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }
  .btn-gold{ background:#fff; color:var(--navy); border:1.5px solid var(--navy); }
  .btn-block{ width:100%; }
  .icon-btn{ background:none; border:none; color:var(--muted); font-size:16px; padding:4px 8px; cursor:pointer; }

  .player-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid var(--navy-mid); }
  .player-row:last-child{ border-bottom:none; }
  .player-name{ font-size:15px; font-weight:500; }

  .match-card{ background:var(--white); border:1.5px solid var(--navy-mid); border-radius:10px; padding:0; overflow:hidden; margin-bottom:14px; cursor:pointer; }
  .match-date{ padding:9px 16px; font-size:12px; font-weight:700; letter-spacing:0.04em; color:var(--muted); text-transform:uppercase; background:var(--navy-light); }
  .match-score{ display:flex; align-items:center; justify-content:center; gap:18px; padding:16px 10px; }

  .empty{ text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }

  .overlay{ position:fixed; inset:0; background:rgba(11,18,32,0.5); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ background:var(--white); width:100%; max-width:720px; border-radius:18px 18px 0 0; max-height:92vh; overflow-y:auto; padding:18px 16px 26px; border-top:1.5px solid var(--navy-mid); }
  .sheet-handle{ width:40px; height:4px; background:var(--navy-mid); border-radius:4px; margin:0 auto 14px; }
  .sheet-title{ font-size:24px; margin:0 0 16px; color:var(--navy); }

  .team-select-header{ display:flex; align-items:center; justify-content:space-between; margin:18px 0 8px; }
  .team-select-header .label{ font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--navy); }
  .team-count{ font-size:12px; color:var(--muted); font-weight:600; }
  .team-count.warn{ color:var(--danger); }
  .team-total{ font-size:20px; font-weight:800; color:var(--navy); }

  .pick-row{ display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid var(--navy-mid); border-radius:6px; }
  .pick-row:last-child{ border-bottom:none; }
  .pick-row.checked{ background:var(--navy-light); }
  .pick-row input[type=checkbox]{ width:19px; height:19px; accent-color:var(--navy); flex-shrink:0; }
  .pick-row .pname{ flex:1; font-size:14.5px; }
  .pick-row .goals-input{ width:60px; text-align:center; padding:6px; }

  .form-actions{ display:flex; gap:10px; margin-top:20px; }

  #rankingCapture{ background:var(--white); border-radius:10px; overflow:hidden; border:1.5px solid var(--navy-mid); }
  .rank-title-strip{ background:var(--navy); color:#fff; padding:14px 16px; }

  .rank-title-strip .rs{ font-size:12px; opacity:0.75; margin-top:2px;}

  table.rank th.left, table.rank td.left{ text-align:left; padding-left:12px; }

  table.rank tr:last-child td{ border-bottom:none; }
  table.rank td.left{ font-weight:600; }
  table.rank td.pts{ font-weight:700; color:var(--navy); }
  table.rank td.gf{ background:var(--navy-light); font-weight:700; }
  .pos{ display:inline-flex; width:20px; height:20px; border-radius:50%; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:var(--navy-light); color:var(--navy); }
  .pos.g1{ background:var(--navy); color:#fff; }
  .pos.g2{ background:var(--navy-mid); color:var(--navy); }
  .pos.g3{ background:var(--navy-light); color:var(--navy); }

  .export-bar{ display:flex; gap:10px; margin-top:14px; }
  .config-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .config-row input{ width:80px; text-align:center; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 20px; border-radius:30px; font-size:13.5px; font-weight:600; z-index:100; opacity:0; transition:opacity .25s ease; pointer-events:none; }
  .toast.show{ opacity:1; }
  .fab{ position:fixed; bottom:22px; right:calc(50% - 360px + 20px); z-index:40; width:56px; height:56px; border-radius:50%; background:var(--navy); color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -6px rgba(11,18,32,0.4); border:none; cursor:pointer; }
  @media (max-width:760px){ .fab{ right:20px; } }
  .viewer-note{ font-size:12.5px; color:var(--navy); background:var(--navy-light); border-radius:10px; padding:12px 14px; margin-bottom:14px; }

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
// ============================================================
// 1) CONFIGURA AQUÍ TU PROYECTO FIREBASE (ver instrucciones)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyD1S028ew8N7LI85ySxWYUVulgpwz0O5VM",
  authDomain: "futbol-viernes-4ccbb.firebaseapp.com",
  projectId: "futbol-viernes-4ccbb",
  storageBucket: "futbol-viernes-4ccbb.firebasestorage.app",
  messagingSenderId: "539909677782",
  appId: "1:539909677782:web:abf94a1375c0057ae1df77",
  measurementId: "G-RBMXHSN265"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// Analytics: solo mide volumen de uso (sesiones, dispositivo, país aproximado).
// No identifica a personas — la app nunca llama a setUserId ni a logEvent.
try{ firebase.analytics(); }catch(e){ /* si el navegador bloquea analytics, no pasa nada */ }

// ---------- State ----------
let players = [];
let matches = [];
let config = { pointsPerGoal: 1 };
let courtPrices = []; // [{id, date, price}] historial de precios de la cancha
let payments = []; // [{id, playerId, date, amount, note}] pagos recibidos
let activeTab = 'partidos';
let sortBy = 'pts'; // 'pts' o 'gf'

// Jugadores invitados: seleccionables en un partido, pero no forman parte
// de la plantilla ni entran en la clasificación (ids fijos, fuera de Firestore).
const GUESTS = [
  { id: 'guest_a', name: 'Invitado_A' },
  { id: 'guest_b', name: 'Invitado_B' },
  { id: 'guest_c', name: 'Invitado_C' },
  { id: 'guest_d', name: 'Invitado_D' },
];
function findAnyPlayer(id){
  return players.find(p=>p.id===id) || GUESTS.find(g=>g.id===id);
}
let playersLoaded = false, matchesLoaded = false, configLoaded = false, pricesLoaded = false, paymentsLoaded = false;
let isAdmin = false;

function ready(){ return playersLoaded && matchesLoaded && configLoaded && pricesLoaded && paymentsLoaded; }

// ---------- Firestore realtime listeners ----------
db.collection('players').onSnapshot(snap=>{
  players = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  playersLoaded = true;
  render();
}, err=> showToast('Error leyendo jugadores'));

db.collection('matches').onSnapshot(snap=>{
  matches = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  matchesLoaded = true;
  render();
}, err=> showToast('Error leyendo partidos'));

db.collection('config').doc('main').onSnapshot(doc=>{
  config = doc.exists ? doc.data() : { pointsPerGoal: 1 };
  configLoaded = true;
  render();
}, err=> showToast('Error leyendo configuración'));

db.collection('courtPrices').onSnapshot(snap=>{
  courtPrices = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  pricesLoaded = true;
  render();
}, err=> showToast('Error leyendo precios de la cancha'));

db.collection('payments').onSnapshot(snap=>{
  payments = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  paymentsLoaded = true;
  render();
}, err=> showToast('Error leyendo pagos'));

auth.onAuthStateChanged(user=>{
  isAdmin = !!user;
  render();
});

// ---------- Firestore write helpers ----------
async function addPlayerDoc(name){
  await db.collection('players').add({ name });
}
async function updatePlayerDoc(id, name){
  await db.collection('players').doc(id).update({ name });
}
async function deletePlayerDoc(id){
  await db.collection('players').doc(id).delete();
}
async function saveMatchDoc(match){
  const { id, ...data } = match;
  await db.collection('matches').doc(id).set(data);
}
async function deleteMatchDoc(id){
  await db.collection('matches').doc(id).delete();
}
async function saveConfigDoc(cfg){
  await db.collection('config').doc('main').set(cfg);
}
async function addCourtPriceDoc(date, price){
  await db.collection('courtPrices').add({ date, price });
}
async function updateCourtPriceDoc(id, date, price){
  await db.collection('courtPrices').doc(id).update({ date, price });
}
async function deleteCourtPriceDoc(id){
  await db.collection('courtPrices').doc(id).delete();
}
// Precio vigente en una fecha dada: el registro más reciente cuya fecha
// sea anterior o igual a la del partido. Si no hay ninguno, devuelve null.
function priceAt(dateStr){
  const applicable = courtPrices.filter(cp => cp.date <= dateStr).sort((a,b)=> b.date.localeCompare(a.date));
  return applicable.length ? Number(applicable[0].price) : null;
}
async function addPaymentDoc(playerId, date, amount, note){
  await db.collection('payments').add({ playerId, date, amount, note: (note||'').slice(0,125) });
}
async function updatePaymentDoc(id, playerId, date, amount, note){
  await db.collection('payments').doc(id).update({ playerId, date, amount, note: (note||'').slice(0,125) });
}
async function deletePaymentDoc(id){
  await db.collection('payments').doc(id).delete();
}
function isGuestId(id){ return GUESTS.some(g=>g.id===id); }

// Historial combinado de un jugador: pagos reales + cargo calculado de cada
// partido que jugó + fechas en que se llevó los petos. Nada de esto (salvo
// los pagos) se guarda — se deriva de matches y courtPrices cada vez.
function buildPlayerHistory(playerId){
  const entries = [];
  payments.filter(p=>p.playerId===playerId).forEach(p=>{
    entries.push({ date:p.date, type:'payment', label: p.note ? `Pago recibido — ${p.note}` : 'Pago recibido', amount:Number(p.amount) });
  });
  matches.forEach(m=>{
    const inVerde = (m.verde||[]).some(x=>x.playerId===playerId);
    const inNaranja = (m.naranja||[]).some(x=>x.playerId===playerId);
    if(inVerde || inNaranja){
      const price = priceAt(m.date);
      if(price!=null){
        const allIds = new Set([...(m.verde||[]).map(x=>x.playerId), ...(m.naranja||[]).map(x=>x.playerId)]);
        const n = allIds.size;
        if(n>0){
          const baseShare = price / n;
          let unsponsoredGuests = 0;
          allIds.forEach(id=>{
            if(isGuestId(id)){
              const eV=(m.verde||[]).find(x=>x.playerId===id), eN=(m.naranja||[]).find(x=>x.playerId===id);
              const paga = (eV ? eV.paga : undefined) ?? (eN ? eN.paga : undefined) ?? true;
              if(paga===false) unsponsoredGuests++;
            }
          });
          const plantillaIds = [...allIds].filter(id=>players.some(p=>p.id===id));
          const extra = plantillaIds.length ? (unsponsoredGuests*baseShare)/plantillaIds.length : 0;
          entries.push({ date:m.date, type:'charge', label:`Partido (cancha ${price.toFixed(2)}€ ÷ ${n})`, amount:-(baseShare+extra) });
        }
      }
    }
    if(m.petos===playerId){
      entries.push({ date:m.date, type:'petos', label:'Se llevó los petos', amount:0 });
    }
  });
  return entries.sort((a,b)=> b.date.localeCompare(a.date));
}
function computeBalance(playerId){
  return buildPlayerHistory(playerId).reduce((s,e)=>s+e.amount, 0);
}
function computePetosCount(playerId){
  return matches.filter(m=>m.petos===playerId).length;
}
function currentCourtPrice(){
  return priceAt(new Date().toISOString().slice(0,10));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function uid(){ return db.collection('_').doc().id; }

// Ventanas propias en vez de prompt()/confirm() nativos (bloqueados si la app
// se visualiza embebida, p.ej. dentro de un artefacto o iframe).
function askText(title, defaultValue){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="sheet">
        <div class="sheet-handle"></div>
        <h2 class="sheet-title">${title}</h2>
        <div class="card"><input type="text" id="askTextInput" value="${escapeHtml(defaultValue||'')}" maxlength="40"></div>
        <div class="form-actions">
          <button class="btn-ghost" id="askTextCancel">Cancelar</button>
          <button class="btn-primary" id="askTextOk">Guardar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#askTextInput');
    input.focus();
    input.select();
    const finish = (val)=>{ overlay.remove(); resolve(val); };
    overlay.onclick = e=>{ if(e.target===overlay) finish(null); };
    overlay.querySelector('#askTextCancel').onclick = ()=> finish(null);
    overlay.querySelector('#askTextOk').onclick = ()=> finish(input.value);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') finish(input.value); });
  });
}
function askConfirm(message, danger){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="card" style="font-size:15px;line-height:1.5;">${escapeHtml(message)}</div>
        <div class="form-actions">
          <button class="btn-ghost" id="askConfCancel">Cancelar</button>
          <button class="${danger?'btn-danger':'btn-primary'}" id="askConfOk">Confirmar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const finish = (val)=>{ overlay.remove(); resolve(val); };
    overlay.onclick = e=>{ if(e.target===overlay) finish(false); };
    overlay.querySelector('#askConfCancel').onclick = ()=> finish(false);
    overlay.querySelector('#askConfOk').onclick = ()=> finish(true);
  });
}

// ---------- Stats ----------
function computeStats(){
  const stats = {};
  players.forEach(p=>{ stats[p.id] = { id:p.id, name:p.name, pj:0, g:0, e:0, p:0, gf:0 }; });
  matches.forEach(m=>{
    const { v: vGoals, n: nGoals, vRes, nRes } = calculaResultado(m);

    // Un jugador puede estar alineado en los dos equipos en el mismo partido
    // (p. ej. para equilibrar el resultado a mitad de partido).
    const inVerde = new Set(), inNaranja = new Set();
    const goalsByPlayer = {};
    (m.verde||[]).forEach(x=>{ inVerde.add(x.playerId); goalsByPlayer[x.playerId] = (goalsByPlayer[x.playerId]||0) + (Number(x.goals)||0); });
    (m.naranja||[]).forEach(x=>{ inNaranja.add(x.playerId); goalsByPlayer[x.playerId] = (goalsByPlayer[x.playerId]||0) + (Number(x.goals)||0); });
    const allIds = new Set([...inVerde, ...inNaranja]);

    allIds.forEach(id=>{
      const s = stats[id];
      if(!s) return; // jugador eliminado
      s.pj++;
      s.gf += goalsByPlayer[id] || 0;
      let res;
      if(inVerde.has(id) && inNaranja.has(id)){
        // Jugó en ambos equipos: se cuenta un solo partido con el mejor resultado
        // de los dos (empate si el partido acabó en empate, victoria si no).
        res = (vGoals === nGoals) ? 'e' : 'g';
      } else if(inVerde.has(id)){
        res = vRes;
      } else {
        res = nRes;
      }
      s[res]++;
    });
  });
  return Object.values(stats).map(s=>({
    ...s, pts: s.g*3 + s.e*1
  })).sort((a,b)=> sortBy==='gf'
    ? (b.gf - a.gf || b.pts - a.pts || a.name.localeCompare(b.name))
    : (b.pts - a.pts || b.gf - a.gf || a.name.localeCompare(b.name))
  );
}
function matchScore(m){
  const v = (m.verde||[]).reduce((s,x)=>s+(Number(x.goals)||0),0);
  const n = (m.naranja||[]).reduce((s,x)=>s+(Number(x.goals)||0),0);
  return {v,n};
}
function calculaResultado(m){
  const {v,n} = matchScore(m);
  let vRes, nRes;
  if(v > n){ vRes='g'; nRes='p'; }
  else if(v < n){ vRes='p'; nRes='g'; }
  else { vRes='e'; nRes='e'; }
  return {v, n, vRes, nRes};
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('es-ES', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
}
function todayDDMMYYYY(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}.${mm}.${d.getFullYear()}`;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Acepta tanto coma como punto como separador decimal al escribir importes.
function parseMoney(str){
  if(str==null) return NaN;
  return Number(String(str).trim().replace(',', '.'));
}

      ${isAdmin ? `<div class="tab ${activeTab==='pagos'?'active':''}" data-tab="pagos">Pagos</div>` : ''}

// ---------- Jugadores tab ----------
function renderJugadores(content){
  const currentPrice = currentCourtPrice();
  const threshold = currentPrice!=null ? currentPrice/10 : 0;
  content.innerHTML = `
    ${isAdmin ? `
    <div class="section-title">Añadir jugador (${players.length}/30)</div>
    <div class="card">
      <div class="row">
        <input type="text" id="newPlayerName" placeholder="Nombre del jugador" maxlength="40" ${players.length>=30?'disabled':''}>
        <button class="btn-primary" id="addPlayerBtn" ${players.length>=30?'disabled':''}>Añadir</button>
      </div>
      ${players.length>=30 ? '<div style="font-size:12.5px;color:var(--danger);margin-top:8px;">Límite de 30 jugadores alcanzado.</div>' : ''}
    </div>` : ''}
    <div class="section-title">Plantilla</div>
    <div class="card" id="playerList" style="padding:6px 12px;">
      ${players.length===0 ? '<div class="empty"><div class="big">⚽</div>Aún no hay jugadores.</div>' :
        players.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{
          const saldo = computeBalance(p.id);
          const petosCount = computePetosCount(p.id);
          const low = saldo < threshold;
          return `
          <div class="player-row" data-id="${p.id}" data-open-history style="cursor:pointer;">
            <div class="player-name" style="flex:1;">${escapeHtml(p.name)}</div>
            <div style="min-width:64px;text-align:right;font-weight:800;font-size:13.5px;padding:3px 7px;border-radius:6px;${low?'background:var(--danger-soft);color:var(--danger);':'color:var(--navy);'}">${saldo.toFixed(2)}€</div>
            <div style="width:44px;text-align:center;color:var(--muted);font-size:12.5px;">🎽${petosCount}</div>
            ${isAdmin ? `
            <div class="row" data-action-group>
              <button class="icon-btn" data-action="edit" data-id="${p.id}">✎</button>
              <button class="icon-btn" data-action="delete" data-id="${p.id}">🗑</button>
            </div>` : ''}
          </div>`;
        }).join('')}
      ${players.length>0 ? (()=>{
        const total = players.reduce((s,p)=>s+computeBalance(p.id), 0);
        const priceThreshold = currentPrice!=null ? currentPrice : 0;
        return `<div class="player-row" style="background:var(--navy-light);border-top:2px solid var(--navy);margin:2px -12px -6px;padding:11px 12px;border-radius:0 0 8px 8px;">
          <div class="player-name" style="flex:1;font-weight:800;text-transform:uppercase;font-size:12.5px;letter-spacing:0.03em;color:var(--navy);">Saldo total</div>
          <div style="min-width:64px;text-align:right;font-weight:800;font-size:15px;color:${total<priceThreshold?'var(--danger)':'var(--navy)'};">${total.toFixed(2)}€</div>
        </div>`;
      })() : ''}
    </div>
  `;

  content.querySelectorAll('[data-open-history]').forEach(row=>{
    row.onclick = (e)=>{
      if(e.target.closest('[data-action-group]')) return;
      openPlayerHistory(row.dataset.id);
    };
  });

  if(!isAdmin) return;

  document.getElementById('addPlayerBtn').onclick = async ()=>{
    const input = document.getElementById('newPlayerName');
    const name = input.value.trim();
    if(!name) return;
    if(players.length>=30){ showToast('Máximo 30 jugadores'); return; }
    await addPlayerDoc(name);
    showToast('Jugador añadido');
  };
  document.getElementById('newPlayerName')?.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('addPlayerBtn').click(); });

  content.querySelectorAll('[data-action="edit"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const p = players.find(p=>p.id===id);
      const newName = await askText('Editar nombre del jugador', p.name);
      if(newName && newName.trim()){ await updatePlayerDoc(id, newName.trim()); showToast('Nombre actualizado'); }
    };
  });
  content.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const usedInMatch = matches.some(m=> (m.verde||[]).some(x=>x.playerId===id) || (m.naranja||[]).some(x=>x.playerId===id));
      const saldo = computeBalance(id);
      const avisos = [];
      if(usedInMatch) avisos.push('seguirá apareciendo como "(jugador eliminado)" en el historial de esos partidos');
      if(Math.abs(saldo) > 0.005) avisos.push(`su saldo actual (${saldo.toFixed(2)}€) dejará de sumarse al saldo total y no podrás volver a consultar su historial`);
      const msg = avisos.length ? `Si lo eliminas: ${avisos.join('; ')}. ¿Eliminar de todos modos?` : '¿Eliminar este jugador?';
      const ok = await askConfirm(msg, true);
      if(!ok) return;
      await deletePlayerDoc(id);
      showToast('Jugador eliminado');
    };
  });
}

function openMatchForm(matchId){
  if(players.length < 2){ showToast('Añade al menos 2 jugadores primero'); return; }
  const editing = !!matchId;
  const match = editing ? matches.find(m=>m.id===matchId) : { id: uid(), date: new Date().toISOString().slice(0,10), verde: [], naranja: [] };
  if(editing && !match){ showToast('Ese partido ya no existe'); return; }
  const work = JSON.parse(JSON.stringify(match));

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title">${editing?'Editar partido':'Nuevo partido'}</h2>
      <div class="card">
        <label style="font-size:12.5px;color:var(--muted);font-weight:600;">Fecha del partido</label>
        <div style="margin-top:6px;overflow:hidden;border-radius:8px;"><input type="date" id="matchDate" value="${work.date}"></div>
      </div>
      <div class="card">
        <div class="team-select-header v"><div class="label">🟢 Equipo Verde</div><div class="row" style="gap:10px;"><div class="team-total" id="totalVerde">0</div><div class="team-count" id="countVerde">0/6</div></div></div>
        <div id="pickVerde"></div>
        <div class="team-select-header n"><div class="label">🟠 Equipo Naranja</div><div class="row" style="gap:10px;"><div class="team-total" id="totalNaranja">0</div><div class="team-count" id="countNaranja">0/6</div></div></div>
        <div id="pickNaranja"></div>
        <div class="tip-box">💡 Puedes alinear al mismo jugador en los dos equipos si cambia de bando a mitad de partido para equilibrarlo.</div>
      </div>
      <div class="card">
        <label style="font-size:12.5px;color:var(--muted);font-weight:600;">¿Quién se lleva los petos?</label>
        <div style="font-size:12px;color:var(--muted);margin:2px 0 6px;">Solo se puede elegir entre quienes juegan este partido.</div>
        <select id="petosSelect"><option value="">— Sin asignar —</option></select>
      </div>
      <div class="form-actions">
        ${editing ? '<button class="btn-danger" id="deleteMatchBtn">Eliminar</button>' : ''}
        <button class="btn-ghost" id="cancelMatchBtn">Cancelar</button>
        <button class="btn-primary" id="saveMatchBtn">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function isInTeam(team, id){ return work[team].some(x=>x.playerId===id); }
  function goalsFor(team, id){ const x = work[team].find(x=>x.playerId===id); return (x && x.goals) ? x.goals : ''; }
  function updateTotal(team, totalId){
    const sum = work[team].reduce((s,x)=>s+(Number(x.goals)||0),0);
    document.getElementById(totalId).textContent = sum;
  }
  function renderPetosOptions(){
    const sel = document.getElementById('petosSelect');
    const idsInMatch = new Set([...work.verde.map(x=>x.playerId), ...work.naranja.map(x=>x.playerId)]);
    const candidates = players.filter(p=>idsInMatch.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name));
    const prevValue = sel.value || work.petos || '';
    sel.innerHTML = `<option value="">— Sin asignar —</option>` +
      candidates.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
    sel.value = candidates.some(p=>p.id===prevValue) ? prevValue : '';
  }
  function renderPicker(team, containerId, countId){
    const container = document.getElementById(containerId);
    const otherTeam = team==='verde'?'naranja':'verde';
    container.innerHTML = players.slice().sort((a,b)=>a.name.localeCompare(b.name)).concat(GUESTS).map(p=>{
      const checked = isInTeam(team, p.id);
      const inBoth = isInTeam(otherTeam, p.id);
      const entry = work[team].find(x=>x.playerId===p.id);
      const paga = entry && entry.paga===false ? false : true;
      return `<div class="pick-row ${checked?'checked':''}">
          <input type="checkbox" data-team="${team}" data-id="${p.id}" ${checked?'checked':''}>
          <div class="pname">${escapeHtml(p.name)}${inBoth ? ' <span class="tag">EN AMBOS</span>' : ''}</div>
          ${checked && isGuestId(p.id) && !(team==='naranja' && inBoth) ? `<label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-right:6px;white-space:nowrap;"><input type="checkbox" data-paga-team="${team}" data-paga-id="${p.id}" ${paga?'checked':''}> Paga${inBoth?' (ambos)':''}</label>` : ''}
          ${checked ? `<input type="number" inputmode="numeric" pattern="[0-9]*" class="goals-input" min="0" data-goals-team="${team}" data-goals-id="${p.id}" value="${goalsFor(team,p.id)}" placeholder="0">` : ''}
        </div>`;
    }).join('');
    document.getElementById(countId).textContent = `${work[team].length}/6`;
    document.getElementById(countId).classList.toggle('warn', work[team].length>0 && work[team].length<5);
    updateTotal('verde','totalVerde');
    updateTotal('naranja','totalNaranja');
    renderPetosOptions();
    container.querySelectorAll('input[type=checkbox][data-team]').forEach(cb=>{
      cb.onchange = ()=>{
        const id = cb.dataset.id;
        if(cb.checked) work[team].push(isGuestId(id) ? { playerId:id, goals:'', paga:true } : { playerId:id, goals:'' });
        else work[team] = work[team].filter(x=>x.playerId!==id);
        renderPicker('verde','pickVerde','countVerde');
        renderPicker('naranja','pickNaranja','countNaranja');
      };
    });
    container.querySelectorAll('input[data-paga-id]').forEach(pc=>{
      pc.onchange = ()=>{
        const id = pc.dataset.pagaId, val = pc.checked;
        // Si el invitado juega en ambos equipos, mantenemos un único
        // estado de "paga", sincronizado entre las dos listas.
        ['verde','naranja'].forEach(tm=>{
          const entry = work[tm].find(x=>x.playerId===id);
          if(entry) entry.paga = val;
        });
        renderPicker('verde','pickVerde','countVerde');
        renderPicker('naranja','pickNaranja','countNaranja');
      };
    });
    container.querySelectorAll('input[type=number]').forEach(gi=>{
      gi.oninput = ()=>{
        const clean = gi.value.replace(/[^0-9]/g, '');
        if(clean !== gi.value) gi.value = clean;
        const t=gi.dataset.goalsTeam, id=gi.dataset.goalsId;
        const entry=work[t].find(x=>x.playerId===id);
        if(entry) entry.goals = clean;
        updateTotal(t, t==='verde'?'totalVerde':'totalNaranja');
      };
    });
  }
  renderPicker('verde','pickVerde','countVerde');
  renderPicker('naranja','pickNaranja','countNaranja');

  document.getElementById('cancelMatchBtn').onclick = ()=> overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  if(editing){
    document.getElementById('deleteMatchBtn').onclick = async ()=>{
      const ok = await askConfirm('¿Eliminar este partido? Esta acción no se puede deshacer.', true);
      if(!ok) return;
      await deleteMatchDoc(matchId);
      overlay.remove();
      showToast('Partido eliminado');
    };
  }
  document.getElementById('saveMatchBtn').onclick = async ()=>{
    work.date = document.getElementById('matchDate').value;
    if(!work.date){ showToast('Indica una fecha'); return; }
    if(work.verde.length < 5 || work.verde.length > 6){ showToast('El equipo Verde necesita 5 o 6 jugadores'); return; }
    if(work.naranja.length < 5 || work.naranja.length > 6){ showToast('El equipo Naranja necesita 5 o 6 jugadores'); return; }
    work.verde = work.verde.map(x=>({ playerId:x.playerId, goals: Number(x.goals)||0, ...(isGuestId(x.playerId) ? {paga: x.paga!==false} : {}) }));
    work.naranja = work.naranja.map(x=>({ playerId:x.playerId, goals: Number(x.goals)||0, ...(isGuestId(x.playerId) ? {paga: x.paga!==false} : {}) }));
    work.petos = document.getElementById('petosSelect').value || null;
    await saveMatchDoc(work);
    overlay.remove();
    showToast(editing?'Partido actualizado':'Partido guardado');
  };
}

    <div class="card">
      <div class="row" style="flex-wrap:wrap;gap:10px;">
        <input type="date" id="newPaymentDate" value="${new Date().toISOString().slice(0,10)}" style="flex:1;min-width:130px;">
        <select id="newPaymentPlayer" style="flex:1;min-width:130px;">
          ${players.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
        </select>
        <input type="text" inputmode="decimal" id="newPaymentAmount" placeholder="€ (puede ser negativo, ej. -12,50)" style="flex:1;min-width:130px;">
      </div>
      <input type="text" id="newPaymentNote" placeholder="Comentario (opcional)" maxlength="125" style="margin-top:10px;">
      <button class="btn-primary btn-block" id="addPaymentBtn" style="margin-top:10px;">Añadir pago</button>
    </div>
    <div class="section-title">Pagos registrados</div>
    <div class="card" style="padding:6px 12px;">
      ${sorted.length===0 ? '<div class="empty"><div class="big">💶</div>Aún no hay pagos registrados.</div>' :
        sorted.map(p=>{
          const player = findAnyPlayer(p.playerId);
          const amt = Number(p.amount);
          return `
          <div class="player-row" data-id="${p.id}">
            <div style="flex:1;">
              <div class="player-name">${fmtDate(p.date)} — ${escapeHtml(player?player.name:'(jugador eliminado)')} — <span style="font-weight:800;color:${amt<0?'var(--danger)':'var(--navy)'};">${amt>=0?'+':''}${amt.toFixed(2)} €</span></div>
              ${p.note ? `<div style="font-size:12px;color:var(--muted);margin-top:2px;">${escapeHtml(p.note)}</div>` : ''}
            </div>
            <div class="row">
              <button class="icon-btn" data-payment-action="edit" data-id="${p.id}">✎</button>
              <button class="icon-btn" data-payment-action="delete" data-id="${p.id}">🗑</button>
            </div>
          </div>`;
        }).join('')}
    </div>
  `;
  document.getElementById('addPriceBtn').onclick = async ()=>{
    const date = document.getElementById('newPriceDate').value;
    const price = parseMoney(document.getElementById('newPriceAmount').value);
    if(!date || !price){ showToast('Indica fecha e importe'); return; }
    const existing = courtPrices.find(cp=>cp.date===date);
    if(existing){
      await updateCourtPriceDoc(existing.id, date, price);
      showToast('Precio de esa fecha sustituido');
    } else {
      await addCourtPriceDoc(date, price);
      showToast('Precio añadido');
    }
  };
  content.querySelectorAll('[data-price-action="edit"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const cp = courtPrices.find(c=>c.id===id);
      const newVal = await askText('Nuevo importe (€) — fecha ' + fmtDate(cp.date), String(cp.price));
      if(newVal===null) return;
      const num = parseMoney(newVal);
      if(!num){ showToast('Importe no válido'); return; }
      await updateCourtPriceDoc(id, cp.date, num);
      showToast('Precio actualizado');
    };
  });
  content.querySelectorAll('[data-price-action="delete"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const ok = await askConfirm('¿Eliminar este registro de precio?', true);
      if(!ok) return;
      await deleteCourtPriceDoc(btn.dataset.id);
      showToast('Precio eliminado');
    };
  });
  document.getElementById('addPaymentBtn').onclick = async ()=>{
    const date = document.getElementById('newPaymentDate').value;
    const playerId = document.getElementById('newPaymentPlayer').value;
    const amount = parseMoney(document.getElementById('newPaymentAmount').value);
    const note = document.getElementById('newPaymentNote').value.trim();
    if(!date || !playerId || !amount){ showToast('Rellena fecha, jugador e importe'); return; }
    await addPaymentDoc(playerId, date, amount, note);
    showToast('Pago añadido');
  };
  content.querySelectorAll('[data-payment-action="edit"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const p = payments.find(x=>x.id===id);
      const newVal = await askText('Nuevo importe (€) — puede ser negativo', String(p.amount));
      if(newVal===null) return;
      const num = parseMoney(newVal);
      if(isNaN(num) || num===0){ showToast('Importe no válido'); return; }
      const newNote = await askText('Comentario (opcional, máx. 125 caracteres)', p.note||'');
      const note = newNote===null ? (p.note||'') : newNote.slice(0,125);
      await updatePaymentDoc(id, p.playerId, p.date, num, note);
      showToast('Pago actualizado');
    };
  });
  content.querySelectorAll('[data-payment-action="delete"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const ok = await askConfirm('¿Eliminar este pago?', true);
      if(!ok) return;
      await deletePaymentDoc(btn.dataset.id);
      showToast('Pago eliminado');
    };
  });
}

// ---------- Clasificación tab ----------
function renderClasificacion(content){
  const stats = computeStats();
  content.innerHTML = `
    <div class="section-title">Clasificación general</div>
    <div class="row" style="gap:8px; margin-bottom:12px;">
      <div class="tab ${sortBy==='pts'?'active':''}" id="sortByPts" style="flex:1;">Por puntos</div>
      <div class="tab ${sortBy==='gf'?'active':''}" id="sortByGf" style="flex:1;">Por goles</div>
    </div>
    <div id="rankingCapture">
      <div class="rank-title-strip">
        <div class="rt">Clasificación</div>
        <div class="rs">${todayDDMMYYYY()} · ${matches.length} partido${matches.length===1?'':'s'} jugado${matches.length===1?'':'s'}</div>
      </div>
      ${stats.length===0 ? '<div class="empty"><div class="big">🏆</div>Todavía no hay estadísticas.</div>' : `
      <table class="rank">
        <thead><tr><th></th><th class="left">Jugador</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>Pts</th></tr></thead>
        <tbody>
          ${stats.map((s,i)=>`
            <tr>
              <td><span class="pos ${i===0?'g1':i===1?'g2':i===2?'g3':''}">${i+1}</span></td>
              <td class="left">${escapeHtml(s.name)}</td>
              <td>${s.pj}</td><td>${s.g}</td><td>${s.e}</td><td>${s.p}</td><td class="gf">${s.gf}</td>
              <td class="pts">${s.pts}</td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
    <div class="export-bar">
      <button class="btn-gold" id="exportJpgBtn" style="flex:1;">Exportar JPG</button>
      <button class="btn-primary" id="exportPdfBtn" style="flex:1;">Exportar PDF</button>
    </div>
  `;
  document.getElementById('sortByPts').onclick = ()=>{ sortBy='pts'; render(); };
  document.getElementById('sortByGf').onclick = ()=>{ sortBy='gf'; render(); };
  document.getElementById('exportJpgBtn').onclick = ()=> exportRanking('jpg');
  document.getElementById('exportPdfBtn').onclick = ()=> exportRanking('pdf');
}

async function exportRanking(type){
  const node = document.getElementById('rankingCapture');
  showToast('Generando…');
  try{
    const canvas = await html2canvas(node, { scale:2, backgroundColor:'#ffffff' });
    if(type==='jpg'){
      const link = document.createElement('a');
      link.download = `clasificacion_futbol_viernes.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    } else {
      const { jsPDF } = window.jspdf;
      const imgData = canvas.toDataURL('image/png');
      const pdfWidth = 210;
      const pdfHeight = canvas.height * pdfWidth / canvas.width;
      const pdf = new jsPDF({ unit:'mm', format:[pdfWidth, Math.max(pdfHeight,297)] });
      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
      pdf.save('clasificacion_futbol_viernes.pdf');
    }
    showToast('Exportado');
  }catch(e){
    showToast('Error al exportar');
  }
}

render();
</script>
